services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sesh
      POSTGRES_USER: sesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sesh-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sesh_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sesh -d sesh"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sesh_database:
